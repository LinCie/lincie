<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #FFFDF8; }
    .ring { stroke: #B8614B; }
    .track { stroke: #B8614B; }
    .signal { fill: #B8614B; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #262D25; }
      .ring { stroke: #E9DDC9; }
      .track { stroke: #D9775F; }
      .signal { fill: #D9775F; }
    }
  </style>
  <circle class="bg ring" cx="16" cy="16" r="14" fill="#FFFDF8" stroke="#B8614B" stroke-width="2" />
  <line class="track" x1="7" y1="16" x2="25" y2="16" stroke="#B8614B" stroke-width="2" stroke-linecap="round" />
  <line class="track" x1="16" y1="7" x2="16" y2="25" stroke="#B8614B" stroke-width="2" stroke-linecap="round" />
  <circle class="signal" cx="16" cy="16" r="3.2" fill="#B8614B" />
</svg>
